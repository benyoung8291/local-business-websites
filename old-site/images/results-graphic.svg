<svg width="480" height="360" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rg1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e8530e;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#e8530e;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="rg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8530e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>
    <filter id="rglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grid lines -->
  <g opacity="0.06">
    <line x1="80" y1="60" x2="80" y2="280" stroke="white" stroke-width="1"/>
    <line x1="80" y1="280" x2="440" y2="280" stroke="white" stroke-width="1"/>
    <line x1="80" y1="226" x2="440" y2="226" stroke="white" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="80" y1="172" x2="440" y2="172" stroke="white" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="80" y1="118" x2="440" y2="118" stroke="white" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Y axis labels -->
  <text x="70" y="284" text-anchor="end" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">0</text>
  <text x="70" y="230" text-anchor="end" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">25%</text>
  <text x="70" y="176" text-anchor="end" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">50%</text>
  <text x="70" y="122" text-anchor="end" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">75%</text>

  <!-- Growth area chart -->
  <path d="M80 280 L140 260 L200 240 L260 200 L320 150 L380 110 L440 75" fill="none"/>
  <path d="M80 280 L140 260 L200 240 L260 200 L320 150 L380 110 L440 75 L440 280 L80 280Z" fill="url(#rg1)"/>
  <path d="M80 280 L140 260 L200 240 L260 200 L320 150 L380 110 L440 75" stroke="url(#rg2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="140" cy="260" r="5" fill="#e8530e" filter="url(#rglow)"/>
  <circle cx="200" cy="240" r="5" fill="#e8530e" filter="url(#rglow)"/>
  <circle cx="260" cy="200" r="5" fill="#e8530e" filter="url(#rglow)"/>
  <circle cx="320" cy="150" r="6" fill="#e8530e" filter="url(#rglow)"/>
  <circle cx="380" cy="110" r="6" fill="#e8530e" filter="url(#rglow)"/>
  <circle cx="440" cy="75" r="8" fill="url(#rg2)" filter="url(#rglow)"/>

  <!-- X axis labels -->
  <text x="80" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">Launch</text>
  <text x="200" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">Month 2</text>
  <text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">Month 4</text>
  <text x="440" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e8530e">Month 6</text>

  <!-- Annotation -->
  <g transform="translate(370, 50)">
    <rect x="0" y="0" width="100" height="36" rx="8" fill="rgba(232,83,14,0.15)" stroke="rgba(232,83,14,0.3)" stroke-width="1"/>
    <text x="50" y="16" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#e8530e">+340%</text>
    <text x="50" y="28" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">more enquiries</text>
  </g>

  <!-- Title -->
  <text x="240" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="rgba(255,255,255,0.7)">Your Business Growth After Launch</text>

  <!-- Bottom label -->
  <text x="240" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.3)">Real results from real small businesses with professional websites</text>
</svg>