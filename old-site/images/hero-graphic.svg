<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8530e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8530e;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.2" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e8530e" flood-opacity="0.25"/>
    </filter>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="browserClip">
      <rect x="40" y="60" width="520" height="380" rx="0 0 16 16"/>
    </clipPath>
  </defs>

  <!-- Ambient glow -->
  <circle cx="300" cy="250" r="200" fill="#e8530e" opacity="0.04"/>
  <circle cx="450" cy="150" r="120" fill="#f59e0b" opacity="0.06"/>

  <!-- Browser window -->
  <g filter="shadow1">
    <rect x="40" y="40" width="520" height="400" rx="16" fill="#1a1a2e"/>
    <!-- Browser chrome -->
    <rect x="40" y="40" width="520" height="44" rx="16" fill="#0f0f23"/>
    <rect x="40" y="68" width="520" height="16" fill="#0f0f23"/>
    <!-- Window buttons -->
    <circle cx="72" cy="62" r="7" fill="#ff5f57"/>
    <circle cx="96" cy="62" r="7" fill="#febc2e"/>
    <circle cx="120" cy="62" r="7" fill="#28c840"/>
    <!-- URL bar -->
    <rect x="150" y="52" width="300" height="20" rx="10" fill="rgba(255,255,255,0.08)"/>
    <text x="210" y="66" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">yourbusiness.com.au</text>
    <!-- Lock icon -->
    <rect x="170" y="57" width="8" height="7" rx="1" fill="#28c840"/>
    <path d="M171 57v-2a3 3 0 016 0v2" stroke="#28c840" stroke-width="1.2" fill="none"/>

    <!-- Website content mockup -->
    <!-- Hero area with gradient -->
    <rect x="40" y="84" width="520" height="160" fill="url(#grad3)"/>

    <!-- Navigation mockup -->
    <rect x="60" y="94" width="60" height="8" rx="4" fill="url(#grad1)" opacity="0.8"/>
    <rect x="400" y="94" width="40" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="450" y="94" width="40" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="500" y="90" width="48" height="16" rx="8" fill="url(#grad1)"/>

    <!-- Hero headline -->
    <rect x="60" y="130" width="280" height="14" rx="4" fill="rgba(255,255,255,0.9)"/>
    <rect x="60" y="152" width="220" height="14" rx="4" fill="rgba(255,255,255,0.6)"/>
    <rect x="60" y="174" width="180" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="60" y="188" width="160" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>

    <!-- Hero CTA button -->
    <rect x="60" y="210" width="120" height="24" rx="12" fill="url(#grad1)"/>
    <rect x="190" y="210" width="80" height="24" rx="12" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Hero image placeholder -->
    <rect x="380" y="120" width="160" height="120" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="460" cy="170" r="20" fill="url(#grad1)" opacity="0.3"/>
    <path d="M400 220l30-30 20 15 30-25 40 40H400z" fill="rgba(255,255,255,0.1)"/>

    <!-- Cards section -->
    <rect x="60" y="264" width="150" height="100" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="225" y="264" width="150" height="100" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="390" y="264" width="150" height="100" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Card icons -->
    <circle cx="85" cy="290" r="14" fill="url(#grad1)" opacity="0.2"/>
    <circle cx="250" cy="290" r="14" fill="url(#grad1)" opacity="0.2"/>
    <circle cx="415" cy="290" r="14" fill="url(#grad1)" opacity="0.2"/>

    <!-- Card content lines -->
    <rect x="75" y="312" width="80" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
    <rect x="75" y="324" width="110" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="75" y="334" width="100" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>

    <rect x="240" y="312" width="90" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
    <rect x="240" y="324" width="100" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="240" y="334" width="110" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>

    <rect x="405" y="312" width="70" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
    <rect x="405" y="324" width="120" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="405" y="334" width="90" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>

    <!-- Footer area -->
    <rect x="40" y="390" width="520" height="50" fill="rgba(0,0,0,0.3)"/>
    <rect x="60" y="408" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="420" y="408" width="50" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="480" y="408" width="50" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  </g>

  <!-- Floating elements -->
  <!-- Performance badge -->
  <g transform="translate(480, 30)">
    <rect width="100" height="48" rx="12" fill="white" filter="url(#shadow1)"/>
    <text x="14" y="22" font-family="sans-serif" font-weight="700" font-size="14" fill="#28c840">100</text>
    <text x="14" y="36" font-family="sans-serif" font-size="9" fill="#666">Performance</text>
    <circle cx="76" cy="24" r="14" fill="none" stroke="#28c840" stroke-width="3"/>
    <path d="M70 24l4 4 8-8" stroke="#28c840" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Mobile preview -->
  <g transform="translate(0, 280)">
    <rect width="100" height="170" rx="14" fill="#1a1a2e" stroke="rgba(255,255,255,0.1)" stroke-width="1" filter="url(#shadow1)"/>
    <rect x="30" y="4" width="40" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <!-- Mobile content -->
    <rect x="10" y="20" width="80" height="50" rx="6" fill="url(#grad3)"/>
    <rect x="16" y="30" width="50" height="5" rx="2" fill="rgba(255,255,255,0.7)"/>
    <rect x="16" y="40" width="40" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="16" y="52" width="30" height="10" rx="5" fill="url(#grad1)" opacity="0.8"/>
    <rect x="10" y="80" width="80" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <rect x="10" y="116" width="80" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <!-- Mobile nav dots -->
    <rect x="38" y="156" width="24" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  </g>

  <!-- Cursor -->
  <g transform="translate(340, 200)">
    <path d="M0 0L0 18L5 14L9 22L12 20L8 13L14 12Z" fill="white" stroke="#1a1a2e" stroke-width="1"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="580" cy="460" r="3" fill="#e8530e" opacity="0.4"/>
  <circle cx="570" cy="475" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="590" cy="470" r="2.5" fill="#e8530e" opacity="0.2"/>
  <circle cx="20" cy="60" r="3" fill="#f59e0b" opacity="0.3"/>
  <circle cx="10" cy="80" r="2" fill="#e8530e" opacity="0.2"/>
</svg>