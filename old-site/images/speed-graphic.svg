<svg width="480" height="360" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8530e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8530e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e8530e;stop-opacity:0"/>
    </linearGradient>
    <filter id="sglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="240" cy="180" r="150" fill="#e8530e" opacity="0.03"/>
  <circle cx="240" cy="180" r="120" fill="none" stroke="#e8530e" stroke-width="0.5" opacity="0.1" stroke-dasharray="4 6"/>

  <!-- Speedometer arc -->
  <g transform="translate(240, 200)">
    <!-- Outer track -->
    <path d="M-110,-10 A110,110 0 0,1 110,-10" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="16" stroke-linecap="round"/>
    <!-- Filled arc (fast!) -->
    <path d="M-110,-10 A110,110 0 0,1 100,-40" fill="none" stroke="url(#sg1)" stroke-width="16" stroke-linecap="round" filter="url(#sglow)"/>

    <!-- Tick marks -->
    <line x1="-100" y1="-40" x2="-90" y2="-36" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-80" y1="-72" x2="-72" y2="-65" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-45" y1="-95" x2="-40" y2="-86" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-106" x2="0" y2="-96" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="-95" x2="40" y2="-86" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="-72" x2="72" y2="-65" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="-40" x2="90" y2="-36" stroke="#e8530e" stroke-width="2" stroke-linecap="round"/>

    <!-- Needle -->
    <line x1="0" y1="0" x2="80" y2="-55" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="url(#sg1)"/>
    <circle cx="0" cy="0" r="4" fill="white"/>

    <!-- Speed text -->
    <text x="0" y="40" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="36" fill="white">FAST</text>
    <text x="0" y="60" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="12" fill="rgba(255,255,255,0.5)">Your site, delivered in days — not months</text>
  </g>

  <!-- Timeline markers -->
  <g transform="translate(60, 290)">
    <line x1="0" y1="0" x2="360" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <!-- Day markers -->
    <circle cx="0" cy="0" r="5" fill="url(#sg1)"/>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Day 1</text>
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#e8530e">Chat</text>

    <circle cx="120" cy="0" r="5" fill="url(#sg1)"/>
    <text x="120" y="20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Day 3</text>
    <text x="120" y="32" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#e8530e">Draft</text>

    <circle cx="240" cy="0" r="5" fill="url(#sg1)"/>
    <text x="240" y="20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Day 5</text>
    <text x="240" y="32" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#e8530e">Review</text>

    <circle cx="360" cy="0" r="5" fill="url(#sg1)"/>
    <text x="360" y="20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Day 7</text>
    <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#e8530e">LIVE!</text>

    <!-- Progress line -->
    <line x1="0" y1="0" x2="360" y2="0" stroke="url(#sg1)" stroke-width="2"/>
  </g>
</svg>