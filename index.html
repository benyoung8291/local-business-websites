<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>notmacOS</title>
    <meta name="description" content="A little operating system living in your browser. Have a poke around — there's more here than it looks.">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="notmacOS">
    <meta property="og:description" content="A little operating system living in your browser. Have a poke around.">
    <meta property="og:type" content="website">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/os.css">
</head>
<body>

    <!-- ===== BOOT SCREEN ===== -->
    <div id="boot">
        <svg class="boot-logo" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true">
            <path fill="currentColor" d="M17.05 12.54c-.03-2.9 2.37-4.29 2.48-4.36-1.35-1.97-3.45-2.24-4.2-2.27-1.79-.18-3.49 1.05-4.4 1.05-.9 0-2.3-1.03-3.79-1-1.95.03-3.75 1.13-4.75 2.88-2.02 3.5-.52 8.69 1.45 11.53.96 1.39 2.11 2.95 3.62 2.9 1.45-.06 2-.94 3.76-.94s2.25.94 3.79.91c1.56-.03 2.55-1.42 3.51-2.81 1.1-1.62 1.56-3.18 1.58-3.26-.03-.02-3.03-1.17-3.05-4.63zM14.16 4.02c.8-.97 1.34-2.32 1.19-3.66-1.15.05-2.55.77-3.38 1.74-.74.85-1.39 2.23-1.22 3.54 1.29.1 2.6-.65 3.41-1.62z"/>
        </svg>
        <div class="boot-progress"><div class="boot-progress-fill"></div></div>
    </div>

    <!-- ===== LOGIN SCREEN ===== -->
    <div id="login" hidden>
        <div class="login-user">
            <div class="login-avatar">😎</div>
            <div class="login-name">Guest</div>
            <form id="login-form" autocomplete="off">
                <input type="password" id="login-password" placeholder="Enter Password" autocomplete="off">
            </form>
            <div class="login-hint">Hint: literally anything works. It's a website.</div>
        </div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop" hidden>
        <div id="wallpaper"></div>

        <!-- Menu bar -->
        <div id="menubar">
            <div class="mb-left">
                <button class="mb-item mb-apple" data-menu="apple" aria-label="Apple menu">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M17.05 12.54c-.03-2.9 2.37-4.29 2.48-4.36-1.35-1.97-3.45-2.24-4.2-2.27-1.79-.18-3.49 1.05-4.4 1.05-.9 0-2.3-1.03-3.79-1-1.95.03-3.75 1.13-4.75 2.88-2.02 3.5-.52 8.69 1.45 11.53.96 1.39 2.11 2.95 3.62 2.9 1.45-.06 2-.94 3.76-.94s2.25.94 3.79.91c1.56-.03 2.55-1.42 3.51-2.81 1.1-1.62 1.56-3.18 1.58-3.26-.03-.02-3.03-1.17-3.05-4.63zM14.16 4.02c.8-.97 1.34-2.32 1.19-3.66-1.15.05-2.55.77-3.38 1.74-.74.85-1.39 2.23-1.22 3.54 1.29.1 2.6-.65 3.41-1.62z"/></svg>
                </button>
                <button class="mb-item mb-appname" data-menu="app">Finder</button>
                <span id="mb-menus"></span>
            </div>
            <div class="mb-right">
                <button class="mb-item mb-icon" id="mb-battery" title="Battery">
                    <span class="battery"><span class="battery-fill"></span></span>
                </button>
                <button class="mb-item mb-icon" id="mb-wifi" title="Wi-Fi">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 20.5c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5zm0-5.5c1.66 0 3.14.68 4.22 1.76l1.42-1.42A7.94 7.94 0 0 0 12 13c-2.21 0-4.21.9-5.64 2.34l1.42 1.42A5.94 5.94 0 0 1 12 15zm0-5c2.97 0 5.66 1.2 7.6 3.15l1.41-1.41A12.7 12.7 0 0 0 12 8c-3.52 0-6.71 1.43-9.01 3.74l1.41 1.41A10.7 10.7 0 0 1 12 10zm0-5c4.35 0 8.29 1.77 11.13 4.62l1.41-1.41A17.66 17.66 0 0 0 12 3C7.11 3 2.68 4.98-.54 8.21l1.41 1.41C3.71 6.77 7.65 5 12 5z" transform="translate(0 -1) scale(.95)"/></svg>
                </button>
                <button class="mb-item mb-icon" id="mb-spotlight" title="Spotlight (⌘K)">
                    <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
                </button>
                <button class="mb-item mb-icon" id="mb-cc" title="Control Center">
                    <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M7.5 4A3.5 3.5 0 0 0 4 7.5 3.5 3.5 0 0 0 7.5 11h9A3.5 3.5 0 0 0 20 7.5 3.5 3.5 0 0 0 16.5 4h-9zm9 5A1.5 1.5 0 1 1 18 7.5 1.5 1.5 0 0 1 16.5 9zm-9 4A3.5 3.5 0 0 0 4 16.5 3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5 3.5 3.5 0 0 0-3.5-3.5h-9zm0 5A1.5 1.5 0 1 1 9 16.5 1.5 1.5 0 0 1 7.5 18z"/></svg>
                </button>
                <button class="mb-item" id="mb-clock">…</button>
            </div>
        </div>

        <!-- Dropdown menus render here -->
        <div id="menu-dropdown" hidden></div>

        <!-- Desktop icons -->
        <div id="desktop-icons"></div>

        <!-- Windows layer -->
        <div id="windows"></div>

        <!-- Dock -->
        <div id="dock-wrap">
            <div id="dock"></div>
        </div>
    </div>

    <!-- ===== SPOTLIGHT ===== -->
    <div id="spotlight" hidden>
        <div class="spotlight-box">
            <div class="spotlight-row">
                <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
                <input id="spotlight-input" type="text" placeholder="Spotlight Search" autocomplete="off" spellcheck="false">
            </div>
            <div id="spotlight-results"></div>
        </div>
    </div>

    <!-- ===== CONTROL CENTER ===== -->
    <div id="control-center" hidden>
        <div class="cc-grid">
            <div class="cc-tile cc-toggles">
                <button class="cc-toggle" id="cc-wifi"><span class="cc-toggle-dot">📶</span><span><b>Wi-Fi</b><small id="cc-wifi-label">LAN Solo 5G</small></span></button>
                <button class="cc-toggle" id="cc-bt"><span class="cc-toggle-dot">🛜</span><span><b>Bluetooth</b><small>On, obviously</small></span></button>
            </div>
            <div class="cc-tile">
                <button class="cc-toggle cc-dark" id="cc-dark"><span class="cc-toggle-dot">🌗</span><span><b>Dark Mode</b><small id="cc-dark-label">Off</small></span></button>
            </div>
            <div class="cc-tile cc-slider-tile">
                <label>☀️ Display</label>
                <input type="range" id="cc-brightness" min="35" max="100" value="100">
            </div>
            <div class="cc-tile cc-slider-tile">
                <label>🔊 Sound</label>
                <input type="range" id="cc-volume" min="0" max="100" value="60">
            </div>
        </div>
    </div>

    <!-- ===== CONTEXT MENU ===== -->
    <div id="context-menu" hidden></div>

    <!-- ===== OVERLAYS ===== -->
    <div id="brightness-overlay"></div>
    <div id="sleep-overlay" hidden><div class="sleep-hint">Click anywhere to wake</div></div>
    <div id="shutdown-overlay" hidden>
        <button id="power-button" title="Power on">⏻</button>
    </div>
    <div id="toasts"></div>

    <script src="assets/os.js"></script>
</body>
</html>
