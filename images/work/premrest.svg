  <text x="400" y="25" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8888aa">premrest.com.au</text>

  <!-- Hero Background - warm gradient -->
  <rect x="0" y="40" width="800" height="460" fill="#f8f4f0"/>

  <!-- Nav bar -->
  <rect x="0" y="40" width="800" height="52" fill="#ffffff" opacity="0.95"/>
  <text x="40" y="72" font-family="system-ui" font-weight="700" font-size="16" fill="#2d2622">PREMREST</text>
  <rect x="40" y="78" width="60" height="2" fill="#D97757"/>
  <text x="380" y="72" font-family="system-ui" font-size="11" fill="#6b5e57">Cleaning</text>
