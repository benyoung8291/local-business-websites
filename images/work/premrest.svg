  <rect x="460" y="130" width="145" height="120" rx="8" fill="#c9b99a" opacity="0.7"/>
  <rect x="615" y="130" width="145" height="120" rx="8" fill="#D97757" opacity="0.3"/>
  <rect x="460" y="260" width="145" height="120" rx="8" fill="#D97757" opacity="0.2"/>
  <rect x="615" y="260" width="145" height="120" rx="8" fill="#c9b99a" opacity="0.5"/>

