  <text x="540" y="72" font-family="system-ui" font-size="11" fill="#6b5e57">Projects</text>
  <text x="640" y="72" font-family="system-ui" font-size="11" fill="#6b5e57">Sustainability</text>
  <rect x="710" y="58" width="70" height="30" rx="15" fill="#D97757"/>
  <text x="745" y="78" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#fff">Let's chat</text>

  <!-- Hero content area -->
  <rect x="40" y="120" width="350" height="14" rx="7" fill="#D97757" opacity="0.15"/>
  <text x="48" y="131" font-family="system-ui" font-size="10" font-weight="600" fill="#D97757" letter-spacing="2">COMMERCIAL FLOORING EXPERTS</text>

  <text x="40" y="185" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#1a1614">Beautiful</text>
  <text x="40" y="235" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#1a1614">Flooring</text>

  <text x="40" y="270" font-family="system-ui" font-size="14" fill="#6b5e57">Professional commercial flooring for</text>
  <text x="40" y="290" font-family="system-ui" font-size="14" fill="#6b5e57">offices, retail and industrial spaces.</text>

  <rect x="40" y="320" width="140" height="44" rx="22" fill="#D97757"/>
  <text x="110" y="347" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="#fff">Get Started</text>
