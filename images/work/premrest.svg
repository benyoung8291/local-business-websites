  <rect x="245" y="425" width="80" height="8" rx="4" fill="#2d2622" opacity="0.15"/>
  <rect x="245" y="440" width="120" height="6" rx="3" fill="#2d2622" opacity="0.08"/>
  <rect x="245" y="452" width="100" height="6" rx="3" fill="#2d2622" opacity="0.08"/>
  <circle cx="365" cy="470" r="12" fill="#6bcb77" opacity="0.2"/>

  <rect x="420" y="410" width="170" height="80" rx="12" fill="#ffffff"/>
  <rect x="435" y="425" width="80" height="8" rx="4" fill="#2d2622" opacity="0.15"/>
  <rect x="435" y="440" width="120" height="6" rx="3" fill="#2d2622" opacity="0.08"/>
