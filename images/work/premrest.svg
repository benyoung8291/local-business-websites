<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Browser Chrome -->
  <rect width="800" height="500" rx="16" fill="#1a1a2e"/>
  <rect y="0" width="800" height="40" rx="16" fill="#2d2b3a"/>
  <rect y="16" width="800" height="24" fill="#2d2b3a"/>
  <circle cx="24" cy="20" r="6" fill="#ff6b6b"/>
