  <rect x="625" y="425" width="80" height="8" rx="4" fill="#2d2622" opacity="0.15"/>
  <rect x="625" y="440" width="120" height="6" rx="3" fill="#2d2622" opacity="0.08"/>
  <rect x="625" y="452" width="100" height="6" rx="3" fill="#2d2622" opacity="0.08"/>
  <circle cx="745" cy="470" r="12" fill="#ffd93d" opacity="0.2"/>
