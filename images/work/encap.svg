<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Browser Chrome -->
  <rect width="800" height="500" rx="16" fill="#0d3320"/>
  <rect y="0" width="800" height="40" rx="16" fill="#1a4a30"/>
  <rect y="16" width="800" height="24" fill="#1a4a30"/>
  <circle cx="24" cy="20" r="6" fill="#ff6b6b"/>
  <circle cx="44" cy="20" r="6" fill="#ffd93d"/>
  <circle cx="64" cy="20" r="6" fill="#6bcb77"/>
  <rect x="200" y="12" width="400" height="18" rx="9" fill="#0d3320" opacity="0.5"/>
  <text x="400" y="25" text-anchor="middle" font-family="system-ui" font-size="10" fill="#88aa88">encap.com.au</text>

  <!-- Deep green background -->
  <rect x="0" y="40" width="800" height="460" fill="#0d2818"/>

  <!-- Organic blob shapes -->
  <defs>
    <radialGradient id="eco1">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="eco2">
      <stop offset="0%" stop-color="#27ae60" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <ellipse cx="650" cy="200" rx="250" ry="200" fill="url(#eco1)"/>
  <ellipse cx="150" cy="350" rx="200" ry="180" fill="url(#eco2)"/>

  <!-- Nav -->
  <text x="40" y="75" font-family="system-ui" font-weight="700" font-size="18" fill="#f0f8f0">encap</text>
  <circle cx="100" cy="70" r="4" fill="#2ecc71"/>
  <text x="400" y="75" font-family="system-ui" font-size="11" fill="#6aaa6a">Home</text>
  <text x="470" y="75" font-family="system-ui" font-size="11" fill="#6aaa6a">Services</text>
  <text x="560" y="75" font-family="system-ui" font-size="11" fill="#6aaa6a">Calculator</text>
  <text x="660" y="75" font-family="system-ui" font-size="11" fill="#6aaa6a">About</text>
  <rect x="720" y="60" width="60" height="30" rx="15" fill="#2ecc71"/>
  <text x="750" y="80" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="#0d2818">Book</text>

  <!-- Hero content -->
  <rect x="340" y="115" width="120" height="24" rx="12" fill="#2ecc71" opacity="0.15"/>
  <text x="400" y="131" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="600" fill="#2ecc71" letter-spacing="1.5">ECO CLEAN</text>

  <text x="400" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#f0f8f0">Low-Moisture</text>
  <text x="400" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#f0f8f0">Carpet <tspan fill="#2ecc71">Cleaning</tspan></text>

  <text x="400" y="268" text-anchor="middle" font-family="system-ui" font-size="13" fill="#6aaa6a">Sustainable carpet care that uses 95% less water.</text>
  <text x="400" y="288" text-anchor="middle" font-family="system-ui" font-size="13" fill="#6aaa6a">Better for your carpets. Better for the planet.</text>

  <!-- CTA -->
  <rect x="300" y="315" width="100" height="40" rx="20" fill="#2ecc71"/>
  <text x="350" y="340" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#0d2818">Book Now</text>
  <rect x="415" y="315" width="100" height="40" rx="20" fill="none" stroke="#2ecc71" stroke-width="1.5" opacity="0.6"/>
  <text x="465" y="340" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="500" fill="#2ecc71">Calculator</text>

  <!-- Calculator card preview -->
  <rect x="150" y="380" width="500" height="100" rx="16" fill="#132e1e" stroke="#1a4a30" stroke-width="1"/>

  <text x="190" y="410" font-family="system-ui" font-size="12" font-weight="600" fill="#f0f8f0">Sustainability Calculator</text>
  <text x="190" y="428" font-family="system-ui" font-size="10" fill="#6aaa6a">See how much water and energy you save</text>

  <!-- Mini chart bars -->
  <rect x="190" y="445" width="40" height="20" rx="4" fill="#2ecc71" opacity="0.6"/>
  <rect x="240" y="440" width="40" height="25" rx="4" fill="#2ecc71" opacity="0.7"/>
  <rect x="290" y="435" width="40" height="30" rx="4" fill="#2ecc71" opacity="0.8"/>
  <rect x="340" y="425" width="40" height="40" rx="4" fill="#2ecc71"/>

  <!-- Water saved stat -->
  <rect x="440" y="400" width="180" height="65" rx="12" fill="#0d2818"/>
  <text x="530" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#2ecc71">95%</text>
  <text x="530" y="450" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6aaa6a">Less Water Used</text>

  <!-- Leaf decorations -->
  <path d="M 720 130 Q 740 110 760 130 Q 740 150 720 130 Z" fill="#2ecc71" opacity="0.15"/>
  <path d="M 730 140 Q 750 120 770 140 Q 750 160 730 140 Z" fill="#2ecc71" opacity="0.1"/>
  <path d="M 60 150 Q 80 130 100 150 Q 80 170 60 150 Z" fill="#2ecc71" opacity="0.12"/>
</svg>
