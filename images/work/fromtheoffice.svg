<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Browser Chrome -->
  <rect width="800" height="500" rx="16" fill="#0f0f1a"/>
  <rect y="0" width="800" height="40" rx="16" fill="#1e1e32"/>
  <rect y="16" width="800" height="24" fill="#1e1e32"/>
  <circle cx="24" cy="20" r="6" fill="#ff6b6b"/>
  <circle cx="44" cy="20" r="6" fill="#ffd93d"/>
  <circle cx="64" cy="20" r="6" fill="#6bcb77"/>
  <rect x="200" y="12" width="400" height="18" rx="9" fill="#0f0f1a" opacity="0.5"/>
  <text x="400" y="25" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8888aa">fromtheoffice.io</text>

  <!-- Dark hero background -->
  <rect x="0" y="40" width="800" height="460" fill="#0a0a18"/>

  <!-- Subtle grid pattern -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1a1a30" stroke-width="0.5"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#1a1a30" stroke-width="0.5"/>
  <line x1="0" y1="220" x2="800" y2="220" stroke="#1a1a30" stroke-width="0.5"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#1a1a30" stroke-width="0.5"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#1a1a30" stroke-width="0.5"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#1a1a30" stroke-width="0.5"/>
  <line x1="200" y1="40" x2="200" y2="500" stroke="#1a1a30" stroke-width="0.5"/>
  <line x1="400" y1="40" x2="400" y2="500" stroke="#1a1a30" stroke-width="0.5"/>
  <line x1="600" y1="40" x2="600" y2="500" stroke="#1a1a30" stroke-width="0.5"/>

  <!-- Glow effect -->
  <ellipse cx="400" cy="240" rx="300" ry="180" fill="url(#glow1)" opacity="0.12"/>
  <defs>
    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <ellipse cx="600" cy="300" rx="200" ry="150" fill="url(#glow2)" opacity="0.08"/>

  <!-- Nav -->
  <text x="40" y="72" font-family="system-ui" font-weight="700" font-size="15" fill="#ffffff">From The Office</text>
  <rect x="680" y="56" width="90" height="32" rx="16" fill="#7c5cff"/>
  <text x="725" y="77" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#fff">Try Free</text>

  <!-- Badge -->
  <rect x="290" y="110" width="220" height="28" rx="14" fill="#7c5cff" opacity="0.15"/>
  <text x="400" y="129" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#7c5cff">AI-Powered Quoting Tool</text>

  <!-- Hero text -->
  <text x="400" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#ffffff">Instant Quotes</text>
  <text x="400" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#ffffff">for <tspan fill="#ff6b35">Tradies</tspan></text>

  <text x="400" y="280" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8888aa">AI-powered quoting that saves you hours.</text>
  <text x="400" y="300" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8888aa">Get accurate estimates in seconds, not days.</text>

  <!-- CTA buttons -->
  <rect x="270" y="330" width="140" height="44" rx="22" fill="#ff6b35"/>
  <text x="340" y="357" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="#fff">Get Started</text>
  <rect x="430" y="330" width="120" height="44" rx="22" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="490" y="357" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="500" fill="#aaa">Watch Demo</text>

  <!-- Floating UI cards -->
  <rect x="80" y="400" width="200" height="80" rx="12" fill="#161628" stroke="#2a2a44" stroke-width="1"/>
  <rect x="95" y="415" width="100" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="95" y="430" width="140" height="6" rx="3" fill="#ffffff" opacity="0.06"/>
  <rect x="95" y="445" width="80" height="20" rx="10" fill="#7c5cff" opacity="0.3"/>
  <text x="135" y="459" text-anchor="middle" font-family="system-ui" font-size="9" fill="#7c5cff">$2,450</text>

  <rect x="310" y="400" width="200" height="80" rx="12" fill="#161628" stroke="#2a2a44" stroke-width="1"/>
  <rect x="325" y="415" width="100" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="325" y="430" width="140" height="6" rx="3" fill="#ffffff" opacity="0.06"/>
  <rect x="325" y="445" width="80" height="20" rx="10" fill="#ff6b35" opacity="0.3"/>
  <text x="365" y="459" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ff6b35">$8,200</text>

  <rect x="540" y="400" width="200" height="80" rx="12" fill="#161628" stroke="#2a2a44" stroke-width="1"/>
  <rect x="555" y="415" width="100" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="555" y="430" width="140" height="6" rx="3" fill="#ffffff" opacity="0.06"/>
  <rect x="555" y="445" width="80" height="20" rx="10" fill="#6bcb77" opacity="0.3"/>
  <text x="595" y="459" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6bcb77">$3,800</text>
</svg>
