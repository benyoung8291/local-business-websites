<svg width="480" height="360" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8530e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>
    <filter id="pshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#e8530e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="240" cy="180" r="160" fill="#e8530e" opacity="0.02"/>

  <!-- Price comparison bars -->
  <!-- Agency bar -->
  <g transform="translate(60, 60)">
    <rect width="360" height="48" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="340" height="48" rx="12" fill="rgba(239,68,68,0.1)"/>
    <text x="20" y="28" font-family="sans-serif" font-weight="600" font-size="13" fill="rgba(255,255,255,0.6)">Agency</text>
    <text x="320" y="28" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="14" fill="#ef4444">$5,000–$15,000</text>
    <text x="340" y="28" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">😱</text>
  </g>

  <!-- Freelancer bar -->
  <g transform="translate(60, 120)">
    <rect width="260" height="48" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="240" height="48" rx="12" fill="rgba(251,191,36,0.1)"/>
    <text x="20" y="28" font-family="sans-serif" font-weight="600" font-size="13" fill="rgba(255,255,255,0.6)">Freelancer</text>
    <text x="220" y="28" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="14" fill="#fbbf24">$2,000–$5,000</text>
    <text x="240" y="28" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">😬</text>
  </g>

  <!-- DIY bar -->
  <g transform="translate(60, 180)">
    <rect width="180" height="48" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="160" height="48" rx="12" fill="rgba(156,163,175,0.1)"/>
    <text x="20" y="28" font-family="sans-serif" font-weight="600" font-size="13" fill="rgba(255,255,255,0.6)">DIY Builder</text>
    <text x="140" y="28" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="14" fill="#9ca3af">$500 + your time</text>
  </g>

  <!-- Ben's bar (highlighted) -->
  <g transform="translate(60, 246)" filter="url(#pshadow)">
    <rect width="150" height="56" rx="14" fill="url(#pg1)"/>
    <text x="20" y="24" font-family="sans-serif" font-weight="800" font-size="14" fill="white">Ben Young</text>
    <text x="20" y="42" font-family="sans-serif" font-weight="700" font-size="16" fill="white">Crazy affordable</text>
    <text x="132" y="36" font-family="sans-serif" font-size="16" fill="white">🔥</text>
  </g>

  <!-- Arrow pointing to Ben's option -->
  <g transform="translate(230, 262)">
    <path d="M0 0 L30 0 L24 -6 M30 0 L24 6" stroke="url(#pg1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="4" font-family="sans-serif" font-weight="600" font-size="12" fill="#e8530e">Pro results, fair price</text>
  </g>

  <!-- Bottom text -->
  <text x="240" y="340" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="11" fill="rgba(255,255,255,0.35)">Why overpay when you can get the same quality for less?</text>
</svg>